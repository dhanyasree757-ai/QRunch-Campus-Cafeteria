<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QRunch | Account</title><style>
:root{--orange:#ef6b16;--cream:#fff9ee;--ink:#211d1b;--muted:#74675e;--line:#f0ddc8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top right,#ffe4bd,transparent 40%),var(--cream);font-family:Inter,Arial,sans-serif;color:var(--ink);padding:20px}.card{width:min(460px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 18px 60px #7a42121c}.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;color:var(--orange);text-decoration:none}.brand img{width:58px;height:52px;object-fit:contain}.eyebrow{font-size:12px;font-weight:800;color:#b94b10;letter-spacing:1px;margin:20px 0 6px}.card h1{font-size:30px;margin:0 0 8px}.sub{color:var(--muted);line-height:1.5;margin:0 0 22px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #e8d8c8;border-radius:12px;font:inherit}button{width:100%;border:0;background:var(--orange);color:white;font-weight:800;padding:14px;border-radius:12px;font-size:15px;margin-top:20px;cursor:pointer}.switch{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}.switch a,.back{color:#c34c0c;font-weight:800;cursor:pointer}.error{color:#b42318;font-size:13px;min-height:18px;margin-top:10px}.demo{font-size:12px;background:#fff5e9;padding:10px;border-radius:10px;color:#74523a;margin-top:16px;line-height:1.5}.back{display:inline-block;margin-top:16px;text-decoration:none;font-size:13px}</style></head><body><main class="card"><a class="brand" href="/"><img src="/qrunch-logo.png" alt="">QRunch</a><p class="eyebrow" id="roleLabel">CUSTOMER PORTAL</p><h1 id="heading">Welcome back</h1><p class="sub" id="subtitle">Sign in to order food and track pickup.</p><form id="form"><div id="nameWrap" hidden><label for="name">Full name</label><input id="name" autocomplete="name" maxlength="60"></div><div id="studentWrap" hidden><label for="studentId">Student ID (optional)</label><input id="studentId" maxlength="30"></div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password"><button id="submit" type="submit">Sign in</button><div class="error" id="error" role="alert"></div></form><div class="switch" id="switchText">New to QRunch? <a id="switchLink">Create account</a></div><div class="demo" id="demo"></div><a class="back" href="/">← Back to home</a></main><script src="/common.js"></script><script src="/auth.js"></script></body></html>
